[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "price-aggregator-backend"
version = "0.1.0"
description = "Price aggregator desktop backend (FastAPI + pluggy)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pluggy>=1.5",
    "pywebview>=5.3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "curl-cffi>=0.7",
    "playwright>=1.45",
    "playwright-stealth>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
build = [
    "pyinstaller>=6.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
